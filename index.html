<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>My Personal Website</h1>
    <p>Jailbreak Trading Values</p>
  </header>

  <main>
    <section id="catalogPage">
      <h2>Vehicle Catalog</h2>

      <input
        type="text"
        id="search"
        placeholder="Search vehicles..."
      >

      <select id="sort">
        <option value="high">Highest Value</option>
        <option value="low">Lowest Value</option>
        <option value="az">A - Z</option>
      </select>

      <select id="rarity">
        <option value="all">All Vehicles</option>
        <option value="Limited">Limited</option>
        <option value="Retired">Retired</option>
        <option value="Available">Available</option>
      </select>

      <p id="count"></p>

      <div id="cars" class="cars"></div>
    </section>

    <section id="details" style="display:none;">
      <button onclick="backToCatalog()">← Back to Catalog</button>

      <img
        id="carDetailImage"
        class="detail-image"
        src=""
        alt="Vehicle"
      >

      <h2 id="carName"></h2>
      <p>Value: <span id="carValue"></span></p>
      <p>Duped: <span id="carDuped"></span></p>
      <p>Rarity: <span id="carRarity"></span></p>
    </section>
  </main>

  <footer>
    <p>My Personal Website © 2026</p>
  </footer>

  <script src="cars.js"></script>
  <script src="script.js"></script>

</body>
</html>
